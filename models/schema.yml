version: 2

sources:
  - name : raw
    schema : gz_raw_data
    tables :
      - name : sales 
        identifier : raw_gz_sales
        description: sales of Greenweez / we have on row per product_id found in each orders_id
        columns:
        - name: orders_id
          tests:
          - not_null
        - name: pdt_id  
          tests:
          - not_null
        tests:
         - unique:
            column_name: "orders_id || '-' || pdt_id"  
      - name : product
        identifier : raw_gz_product
        description: product of Greenweez / one product_id with it's price
        columns:
          - name: products_id
            tests:
            - not_null
            - unique
      - name : ship
        identifier : raw_gz_ship
        description: shipping of Greenweez / one order_ID with its shipping/log cost/fee
        columns:
          - name: orders_id
            tests:
            - not_null
            - unique

models:
   - name: int_product_margin
     description: margin calculation per product
     columns:
       - name: products_id
         description: products key
         tests:
           - not_null
       - name: orders_id
         description: orders key
         tests:
           - not_null
       - name: margin
         description: Margin = Revenue - Purchase_cost
         tests:
           - not_null
       - name: Purchase_cost
         description: Purchase_cost = Quantity * Purchase_price
         tests:
           - not_null
       - name: date_date
         description: date of the order
         tests:
           - not_null
       - name: revenue
         description: sum of revenue per order
         tests:
           - not_null
       - name: total_qty
         description: sum of quantity per order
         tests:
           - not_null
     tests:
       - unique:
           column_name: "(orders_id || '-' || products_id)"

   - name: int_orders_margin
     description: margin calculation per orders
     columns:
       - name: orders_id
         description: orders key
         tests:
           - not_null
           - unique
       - name: margin
         description: Margin = Revenue - Purchase_cost
         tests:
           - not_null
       - name: Purchase_cost
         description: Purchase_cost = Quantity * Purchase_price
         tests:
           - not_null
       - name: date_date
         description: date of the order
         tests:
           - not_null
       - name: revenue
         description: sum of revenue per order
         tests:
           - not_null
       - name: total_qty
         description: sum of quantity per order
         tests:
           - not_null
       - name: purchase_cost
         description: Purchase_cost = Quantity * Purchase_price
         tests:
           - not_null

   - name: int_orders_operational
     description: operational margin calculation per orders
     columns:
       - name: orders_id
         description: orders key
         tests:
           - not_null
           - unique
       - name: operational_margin
         description: Operational_margin = margin + shipping_fee - log_cost - ship_cost
         tests:
           - not_null
       - name: date_date
         description: date of the order
         tests:
           - not_null
       - name: revenue
         description: sum of revenue per order
         tests:
           - not_null
       - name: total_qty
         description: sum of quantity per order
         tests:
           - not_null
       - name: purchase_price
         description: sum of Purchase_price
         tests:
           - not_null